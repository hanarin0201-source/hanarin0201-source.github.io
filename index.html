<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2453d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="콕매치">
<link rel="manifest" href="/manifest.webmanifest">
<title>콕매치</title>
<style>
:root{--b:#2453d4;--bg:#f5f7fb;--line:#dbe3f8;--tx:#172033;--mut:#8793ad;--red:#d94646}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--tx)}button,input,select{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#2453d4,#4e3ac8);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 15px;border-radius:0 0 22px 22px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:22px;font-weight:900}.small{font-size:12px;opacity:.88}.role{border:1px solid #ffffff55;background:#ffffff22;color:#fff;border-radius:999px;padding:7px 10px;font-weight:800;font-size:12px}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.sum div{background:#ffffff20;border-radius:13px;padding:8px;text-align:center}.sum b{display:block;font-size:20px}.view{display:none;padding:14px}.view.on{display:block}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.title h2{margin:0;font-size:18px}.btn{border:0;border-radius:12px;padding:11px 12px;font-weight:850}.pri{background:var(--b);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--red)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:9px}.member{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#eaf0ff;color:var(--b);font-weight:900}.name{font-weight:900}.meta{font-size:12px;color:var(--mut);margin-top:3px}.tag{display:inline-block;margin-left:5px;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:900;background:#edf2ff;color:var(--b)}.queue{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center}.ord{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#edf1f8;font-weight:900}.sel{outline:3px solid #91aaff;background:#f6f8ff}.qact{display:flex;gap:8px;margin-bottom:10px}.court{display:grid;grid-template-columns:68px 1fr;padding:0;overflow:hidden}.cno{display:grid;place-items:center;background:#edf3ff;color:var(--b);font-weight:900;border-right:1px solid var(--line)}.cbody{padding:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center}.team{text-align:center;background:#f7f9ff;border-radius:11px;padding:8px;font-weight:850}.foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.empty{text-align:center;color:var(--mut);padding:30px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:23px;color:var(--b)}.note{font-size:12px;color:#60708f;background:#edf2ff;border-radius:12px;padding:10px 12px;margin-bottom:10px}.hide{display:none!important}nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#f2f5ff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}nav button{border:0;background:transparent;padding:8px 2px;color:#8a98bc;font-size:11px;font-weight:800}nav button.on{color:var(--b);background:#e5ebff}nav i{display:block;font-style:normal;font-size:20px}.modal{position:fixed;inset:0;background:#10182d88;display:none;align-items:flex-end;justify-content:center;z-index:80}.modal.on{display:flex}.sheet{width:min(760px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h3{margin:0 0 12px}.field{margin-bottom:9px}.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.acts{display:flex;gap:8px;margin-top:12px}.acts>*{flex:1}.login{position:fixed;inset:0;background:linear-gradient(145deg,#214cc5,#5434c6);z-index:100;display:grid;place-items:center;padding:18px}.loginbox{width:min(430px,100%);background:#fff;border-radius:24px;padding:22px}.loginbox h1{margin:0 0 5px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:800}.tabs button.on{background:#edf2ff;color:var(--b);border-color:#aebeff}.error{font-size:12px;color:#c93636;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>🏸 콕매치</h1><div class="meta" style="font-size:14px">배드민턴 클럽 로그인</div><div class="tabs"><button id="tm" class="on" onclick="mode('member')">회원</button><button id="to" onclick="mode('organizer')">게임편성자</button><button id="ta" onclick="mode('admin')">총관리자</button></div><div class="field"><label id="loginLabel">등록된 회원 이름</label><input id="cred" autocomplete="off" placeholder="예: 박태영"></div><button class="btn pri" style="width:100%" onclick="doLogin()">로그인</button><div id="le" class="error"></div><div class="note" style="margin-top:12px">회원은 등록된 이름과 정확히 동일하게 입력해야 합니다.</div></div></div>
<div class="app"><header class="top"><div class="bar"><div><div class="brand">🏸 콕매치</div><div id="who" class="small">-</div></div><button class="role" onclick="logout()">로그아웃</button></div><div class="sum"><div><b id="sm">0</b><span class="small">오늘 인원</span></div><div><b id="sw">0</b><span class="small">대기</span></div><div><b id="sg">0</b><span class="small">게임중</span></div></div></header>
<main>
<section id="members" class="view on"><div class="title"><h2>회원목록</h2><button id="addBtn" class="btn pri hide" onclick="openM('memberModal')">+ 회원/게스트</button></div><div id="memberNote" class="note">일반회원은 조회만 가능합니다.</div><div id="ml"></div></section>
<section id="queue" class="view"><div class="title"><h2>게임대기</h2><span id="pick" class="tag">0 / 4</span></div><div id="qact" class="qact hide"><button class="btn pri" style="flex:1" onclick="startGame()">선택 4명 게임편성</button><button class="btn ghost" onclick="autoPick()">추천 4명</button></div><div id="ql"></div></section>
<section id="playing" class="view"><div class="title"><h2>게임중</h2><span class="tag">빈 코트 자동배정</span></div><div id="cl"></div></section>
<section id="stats" class="view"><div class="title"><h2>클럽통계</h2></div><div class="grid"><div class="stat"><b id="stg">0</b>완료 게임</div><div class="stat"><b id="stm">0분</b>플레이시간</div><div class="stat"><b id="stp">0</b>점수 기록</div><div class="stat"><b id="stu">0</b>참여 인원</div></div><div class="card" style="margin-top:10px"><b>최근 경기</b><div id="hl"></div></div></section>
<section id="settings" class="view"><div class="title"><h2>설정</h2></div><div class="card"><b>로그인 정보</b><div id="acct" class="meta" style="font-size:14px;line-height:1.7"></div></div><div id="adminSet" class="card hide"><b>총관리자 설정</b><div class="field" style="margin-top:10px"><label>사용 코트 수</label><select id="cc"><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div><button class="btn pri" onclick="setCourts()">코트 수 저장</button></div><div class="card"><b>홈 화면에 추가</b><p class="meta" style="font-size:14px;line-height:1.7">아이폰 Safari: 공유 → 홈 화면에 추가<br>갤럭시 Chrome: 메뉴 → 홈 화면에 추가</p></div></section>
</main></div>
<nav><button class="on" data-v="members" onclick="go(this)"><i>👥</i>회원목록</button><button data-v="queue" onclick="go(this)"><i>▦</i>게임대기</button><button data-v="playing" onclick="go(this)"><i>🏸</i>게임중</button><button data-v="stats" onclick="go(this)"><i>▥</i>클럽통계</button><button data-v="settings" onclick="go(this)"><i>⚙️</i>설정</button></nav>
<div id="memberModal" class="modal"><div class="sheet"><h3>회원 / 게스트 등록</h3><div class="field"><label>이름</label><input id="mn" placeholder="이름"></div><div class="grid"><div class="field"><label>출생연도</label><input id="my" type="number" inputmode="numeric" placeholder="1989"></div><div class="field"><label>성별</label><select id="mg"><option>남</option><option>여</option></select></div><div class="field"><label>연령대</label><select id="ma"><option>20</option><option selected>30</option><option>40</option><option>50</option><option>60</option></select></div><div class="field"><label>급수</label><select id="mc"><option>A</option><option>B</option><option selected>C</option><option>D</option></select></div></div><div class="field"><label>구분</label><select id="mt"><option value="member">일반회원</option><option value="guest">게스트</option></select></div><div class="acts"><button class="btn ghost" onclick="closeM('memberModal')">취소</button><button class="btn pri" onclick="addMember()">등록</button></div></div></div>
<div id="score" class="modal"><div class="sheet"><h3>경기 종료</h3><div id="si" class="card"></div><div class="grid"><div class="field"><label>A팀 점수</label><input id="sa" type="number" inputmode="numeric"></div><div class="field"><label>B팀 점수</label><input id="sb" type="number" inputmode="numeric"></div></div><div class="acts"><button class="btn ghost" onclick="finish(false)">점수 없이 종료</button><button class="btn pri" onclick="finish(true)">점수 저장 후 종료</button></div></div></div>
<script>
const API='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-api';
let S={courtCount:8,members:[],queue:[],games:[],history:[]},sel=[],endId=null,loginMode='member',me=null,T=localStorage.getItem('kokmatch_token')||'';
const $=x=>document.getElementById(x),M=id=>S.members.find(m=>m.id===id),elev=()=>me&&(me.role==='organizer'||me.role==='admin');
function mode(m){loginMode=m;['member','organizer','admin'].forEach((x,i)=>$('t'+['m','o','a'][i]).classList.toggle('on',x===m));$('loginLabel').textContent=m==='member'?'등록된 회원 이름':m==='organizer'?'게임편성자 PIN':'총관리자 PIN';$('cred').placeholder=m==='member'?'예: 박태영':'6자리 PIN';$('cred').type=m==='member'?'text':'password';$('cred').value='';$('le').textContent=''}
async function req(api,method='GET',body){const r=await fetch(API+'?api='+api,{method,headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:body?JSON.stringify(body):undefined});const x=await r.json().catch(()=>({error:'통신 오류'}));if(!r.ok)throw new Error(x.error||'오류');return x}
async function doLogin(){try{const x=await req('login','POST',{mode:loginMode,credential:$('cred').value});T=x.token;localStorage.setItem('kokmatch_token',T);me={role:x.role,displayName:x.displayName};$('login').classList.add('hide');await load();applyRole()}catch(e){$('le').textContent=e.message}}
async function boot(){if(!T)return;try{await load();$('login').classList.add('hide');applyRole()}catch(e){localStorage.removeItem('kokmatch_token');T=''}}
async function load(){const x=await req('state');S=x.data;me=x.user;render()}
function applyRole(){if(!me)return;const rn=me.role==='admin'?'총관리자':me.role==='organizer'?'게임편성자':'일반회원';$('who').textContent=me.displayName+' · '+rn;$('acct').textContent=me.displayName+' / '+rn+' / 로그인 세션 최대 12시간';$('addBtn').classList.toggle('hide',!elev());$('adminSet').classList.toggle('hide',me.role!=='admin');$('qact').classList.toggle('hide',!elev());$('memberNote').textContent=elev()?'회원등록 및 회원카드 터치로 입장/퇴장 변경이 가능합니다.':'일반회원은 회원·대기·경기·통계를 조회만 할 수 있습니다.';$('cc').value=S.courtCount;render()}
async function logout(){try{await req('logout','POST')}catch{}localStorage.removeItem('kokmatch_token');location.reload()}
function go(b){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(b.dataset.v).classList.add('on')}
const tag=m=>'<span class="tag">'+m.age+m.cls+'</span>'+(m.type==='guest'?'<span class="tag">GUEST</span>':'');const mins=m=>Math.max(0,Math.floor((Date.now()-(m.joinedAt||Date.now()))/60000));
function render(){$('sm').textContent=S.members.filter(m=>m.state!=='out').length;$('sw').textContent=S.queue.length;$('sg').textContent=S.games.length;$('ml').innerHTML=S.members.map(m=>'<div class="card member" '+(elev()?'onclick="toggle(\''+m.id+'\')"':'')+'><div class="av">'+m.name.slice(-1)+'</div><div><div class="name">'+m.name+tag(m)+'</div><div class="meta">'+m.year+'년생 · '+m.gender+'</div></div><div class="meta">'+(m.state==='waiting'?'대기 '+mins(m)+'분':m.state==='playing'?'게임중':'퇴장')+'</div></div>').join('');$('ql').innerHTML=S.queue.length?S.queue.map((id,i)=>{const m=M(id);return '<div class="card queue '+(sel.includes(id)?'sel':'')+'" '+(elev()?'onclick="pick(\''+id+'\')"':'')+'><div class="ord">'+(i+1)+'</div><div><div class="name">'+m.name+tag(m)+'</div><div class="meta">'+m.gender+' · '+mins(m)+'분 대기</div></div><b>'+(sel.includes(id)?'✓':'')+'</b></div>'}).join(''):'<div class="empty">대기 회원이 없습니다.</div>';$('pick').textContent=sel.length+' / 4';let c='';for(let i=1;i<=S.courtCount;i++){const g=S.games.find(x=>x.court===i);c+='<div class="card court"><div class="cno">'+i+' 코트</div><div class="cbody">'+(g?game(g):'<div class="empty" style="padding:25px">비어 있음</div>')+'</div></div>'}$('cl').innerHTML=c;const tm=S.history.reduce((a,h)=>a+(h.durationMin||0),0);$('stg').textContent=S.history.length;$('stm').textContent=tm+'분';$('stp').textContent=S.history.filter(h=>Number.isFinite(h.scoreA)&&Number.isFinite(h.scoreB)).length;$('stu').textContent=new Set(S.history.flatMap(h=>h.players)).size;$('hl').innerHTML=S.history.length?S.history.slice().reverse().slice(0,15).map(h=>'<div style="padding:9px 0;border-bottom:1px solid #edf0f7"><b>'+h.court+'코트</b> '+h.players.map(id=>M(id)?.name||'-').join(' · ')+'<div class="meta">'+(Number.isFinite(h.scoreA)?h.scoreA+' : '+h.scoreB:'점수 기록 없음')+' · '+h.durationMin+'분</div></div>').join(''):'<div class="empty">완료된 게임이 없습니다.</div>';if(me?.role==='admin')$('cc').value=S.courtCount}
function game(g){const p=g.players.map(M);return '<div class="teams"><div class="team">'+p[0].name+'<br>'+p[1].name+'</div><b>VS</b><div class="team">'+p[2].name+'<br>'+p[3].name+'</div></div><div class="foot"><span class="meta">'+new Date(g.startedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 시작</span>'+(elev()?'<button class="btn danger" onclick="openScore(\''+g.id+'\')">경기종료</button>':'')+'</div>'}
function pick(id){if(!elev())return;sel=sel.includes(id)?sel.filter(x=>x!==id):sel.length<4?[...sel,id]:sel;render()}function autoPick(){if(!elev())return;sel=S.queue.slice(0,4);render()}
async function action(a,b){try{const x=await req('action','POST',{action:a,...b});S=x.data;sel=[];render();applyRole()}catch(e){alert(e.message);await load()}}
async function toggle(id){await action('toggle_member',{id})}async function startGame(){if(sel.length!==4)return alert('4명을 선택해주세요.');await action('start_game',{players:sel});document.querySelector('[data-v="playing"]').click()}
function openScore(id){endId=id;const g=S.games.find(x=>x.id===id),p=g.players.map(M);$('si').innerHTML='<b>'+g.court+'코트</b><div class="meta" style="font-size:14px">'+p[0].name+' · '+p[1].name+' VS '+p[2].name+' · '+p[3].name+'</div>';$('sa').value='';$('sb').value='';openM('score')}
async function finish(withScore){const a=withScore?Number($('sa').value):null,b=withScore?Number($('sb').value):null;if(withScore&&(!Number.isFinite(a)||!Number.isFinite(b)))return alert('점수를 입력해주세요.');closeM('score');await action('finish_game',{gameId:endId,scoreA:a,scoreB:b});endId=null}
async function addMember(){const name=$('mn').value.trim();if(!name)return alert('이름을 입력해주세요.');closeM('memberModal');await action('add_member',{name,year:Number($('my').value),gender:$('mg').value,age:$('ma').value,cls:$('mc').value,type:$('mt').value});$('mn').value=''}
async function setCourts(){await action('set_courts',{count:Number($('cc').value)})}function openM(id){$(id).classList.add('on')}function closeM(id){$(id).classList.remove('on')}document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeM(m.id)}));if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});boot();setInterval(()=>{if(T)load().catch(()=>{})},3000);setInterval(render,60000);
</script>
</body></html>
