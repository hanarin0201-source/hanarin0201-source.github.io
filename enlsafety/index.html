<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>이앤엘 사고보고</title><style>:root{--b:#0f4c81;--bg:#f4f7fb;--line:#dfe7ef;--txt:#182230;--mut:#6c7a89;--ok:#16845b;--warn:#d47a10;--red:#d64545}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--txt)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:13px 16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:11px;background:var(--b);color:white;display:grid;place-items:center;font-weight:900;font-size:12px}.brand b{font-size:18px}.brand small{display:block;color:var(--mut);margin-top:2px}.roles{display:flex;gap:6px;margin-top:12px;background:#edf2f7;padding:4px;border-radius:10px}.roles button{flex:1;border:0;border-radius:8px;padding:9px 4px;background:transparent;color:#5c6b7c;font-weight:800;font-size:12px}.roles button.on{background:#fff;color:var(--b);box-shadow:0 2px 8px #00000012}.wrap{max-width:1100px;margin:auto;padding:14px 12px 40px}.note{font-size:11px;color:var(--mut);margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 320px;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 8px 24px #2135470b}.panel h2{margin:0 0 5px;font-size:21px}.sub{color:var(--mut);font-size:11px;margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lbl{display:block;margin-top:10px}.lbl span{display:block;font-size:11px;font-weight:800;color:#536476;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #d8e1ea;border-radius:10px;padding:10px;background:#fbfcfe;color:var(--txt)}textarea{resize:vertical}.photos{margin-top:12px;border:1px dashed #c7d2de;border-radius:12px;background:#f8fafc;padding:12px}.photoBtns{display:flex;gap:8px;flex-wrap:wrap}.photoBtns label,.photoBtns button{border:1px solid #b9cadb;background:#fff;color:#315a7c;border-radius:9px;padding:9px 11px;font-size:11px;font-weight:800;cursor:pointer}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumb{width:88px;height:88px;position:relative;border-radius:10px;overflow:hidden;background:#e8edf2}.thumb img{width:100%;height:100%;object-fit:cover}.thumb button{position:absolute;right:4px;top:4px;width:24px;height:24px;border:0;border-radius:50%;background:#000b;color:#fff;font-weight:900}.submit{width:100%;margin-top:15px;border:0;border-radius:10px;background:#2166d5;color:#fff;padding:12px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f6f8fb;border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:21px;color:var(--b)}.stat span{font-size:9px;color:var(--mut)}.recent{margin-top:12px}.item{border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:8px}.itemTop{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--mut)}.item p{font-size:11px;line-height:1.4;margin:6px 0}.pill{display:inline-block;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:900;margin-right:4px}.reported{background:#fff0dc;color:#a75b0d}.approved{background:#e8f2ff;color:#245fae}.closed{background:#e7f7f0;color:#167050}.sev1{background:#eef3f8;color:#53677f}.sev2{background:#fff1df;color:#a55b11}.sev3{background:#fff0f0;color:#b73838}.dashTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.card b{display:block;font-size:25px;margin-top:4px}.card span{font-size:10px;color:var(--mut)}.toolbar{display:flex;gap:8px;margin:8px 0}.toolbar select{width:auto}.tableWrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:760px}.tbl th,.tbl td{border-bottom:1px solid #edf1f5;padding:10px;text-align:left;font-size:10px}.tbl th{background:#f8fafc;color:#728196}.tbl tr{cursor:pointer}.mgrGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mgr{border:1px solid var(--line);border-radius:13px;background:#fff;padding:14px;cursor:pointer}.mgr h3{margin:6px 0;font-size:15px}.mgr p{font-size:11px;color:#536476;line-height:1.45}.modal{position:fixed;inset:0;background:#17212dcc;z-index:30;display:grid;place-items:center;padding:12px}.drawer{background:#fff;width:min(580px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:17px}.drawerTop{display:flex;justify-content:space-between;gap:10px}.x{border:0;border-radius:50%;width:34px;height:34px;font-size:20px}.drawerPhotos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.drawerPhotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{border:0;border-radius:8px;padding:9px 12px;font-weight:800;font-size:11px}.approve{background:#2166d5;color:#fff}.closeBtn{background:#18805b;color:#fff}.delete{background:#ffecec;color:#b83d3d}.save{background:#eef2f6;color:#33485d}.hide{display:none!important}.empty{text-align:center;color:#909cab;padding:24px;font-size:11px}@media(max-width:820px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.mgrGrid{grid-template-columns:1fr}.top{position:relative}}@media(max-width:480px){.formgrid{grid-template-columns:1fr}.thumb{width:82px;height:82px}.brand small{display:none}.drawerPhotos{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="brand"><div class="logo">E&L</div><div><b>이앤엘 사고보고</b><small>Incident Reporting Test</small></div></div><div class="roles"><button class="on" data-role="field">현장소장</button><button data-role="safety">안전관리자</button><button data-role="manager">관리자</button></div></header><main class="wrap"><p id="roleNote" class="note">● 현장소장 화면 · 사고 발생 직후 간단히 등록합니다.</p><section id="fieldView"><div class="grid"><div class="panel"><h2>사고 등록</h2><p class="sub">현장에서 모바일로 바로 등록하는 테스트 화면입니다.</p><form id="reportForm"><div class="formgrid"><label class="lbl"><span>현장</span><select id="site"></select></label><label class="lbl"><span>사고 발생 일시</span><input id="occurredAt" type="datetime-local" required></label><label class="lbl"><span>사고 유형</span><select id="type"><option>넘어짐</option><option>부딪힘</option><option>끼임</option><option>베임</option><option>골절/염좌</option><option>차량/장비</option><option>기타</option></select></label><label class="lbl"><span>중대도</span><select id="severity"><option>경미</option><option>보통</option><option>중요</option></select></label><label class="lbl"><span>사고자</span><input id="injured" placeholder="성명"></label><label class="lbl"><span>직종/업무</span><input id="job" placeholder="예: 코스관리"></label></div><label class="lbl"><span>사고 내용 *</span><textarea id="summary" rows="4" required placeholder="어디서 무엇을 하다가 어떻게 사고가 났는지 간단히 입력"></textarea></label><label class="lbl"><span>현장 즉시조치</span><textarea id="action" rows="3" placeholder="응급조치, 작업중지, 병원이송 등"></textarea></label><div class="photos"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:11px;color:#536476">현장사진</b><small id="photoCount">0 / 8장</small></div><div class="photoBtns"><label>📷 사진 촬영<input id="cameraInput" type="file" accept="image/*" capture="environment" multiple hidden></label><label>🖼️ 앨범에서 선택<input id="albumInput" type="file" accept="image/*" multiple hidden></label></div><div id="thumbs" class="thumbs"></div></div><label class="lbl"><span>보고자 *</span><input id="reporter" required placeholder="현장소장 성명"></label><button class="submit">사고보고 등록</button></form></div><aside class="panel"><h2 style="font-size:17px">현재 현황</h2><div class="stats"><div class="stat"><b id="todayCount">0</b><span>오늘 등록</span></div><div class="stat"><b id="waitCount">0</b><span>검토 대기</span></div><div class="stat"><b id="approvedCount">0</b><span>승인</span></div></div><div id="recent" class="recent"></div></aside></div></section><section id="safetyView" class="hide"><div class="dashTop"><div><h2 style="margin:0">안전관리자 대시보드</h2><p class="sub">전체 사고 검토, 수정, 승인, 종결</p></div></div><div class="cards"><div class="card"><span>전체</span><b id="allCount">0</b></div><div class="card"><span>접수</span><b id="rCount">0</b></div><div class="card"><span>승인</span><b id="aCount">0</b></div><div class="card"><span>종결</span><b id="cCount">0</b></div></div><div class="panel"><div class="toolbar"><select id="siteFilter"><option>전체</option></select><select id="statusFilter"><option value="전체">전체 상태</option><option value="reported">접수</option><option value="approved">승인</option><option value="closed">종결</option></select></div><div class="tableWrap"><table class="tbl"><thead><tr><th>일시</th><th>현장</th><th>유형</th><th>내용</th><th>중대도</th><th>상태</th><th>사진</th></tr></thead><tbody id="rows"></tbody></table><div id="tableEmpty" class="empty">등록된 사고가 없습니다.</div></div></div></section><section id="managerView" class="hide"><div><h2 style="margin:0">관리자 사고현황</h2><p class="sub">안전관리자가 승인한 사고만 표시됩니다.</p></div><div id="mgrGrid" class="mgrGrid"></div></section></main><div id="modalRoot"></div><script>const $=id=>document.getElementById(id),KEY='enl_incident_v2',MAX=8;let photos=[];const initial={sites:['본사','동탄 현장','용인 현장','평택 물류'],incidents:[]};let data=JSON.parse(localStorage.getItem(KEY)||'null')||initial;function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(s))}function localDT(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}function statusP(s){return `<span class="pill ${s}">${s==='reported'?'접수':s==='approved'?'승인':'종결'}</span>`}function sevP(s){return `<span class="pill ${s==='경미'?'sev1':s==='보통'?'sev2':'sev3'}">${esc(s)}</span>`}function renderSites(){site.innerHTML=data.sites.map(x=>`<option>${esc(x)}</option>`).join('');siteFilter.innerHTML='<option>전체</option>'+data.sites.map(x=>`<option>${esc(x)}</option>`).join('')}function renderPhotos(){thumbs.innerHTML=photos.map((p,i)=>`<div class="thumb"><img src="${p}"><button type="button" onclick="removePhoto(${i})">×</button></div>`).join('');photoCount.textContent=`${photos.length} / ${MAX}장`}function removePhoto(i){photos.splice(i,1);renderPhotos()}function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const max=1200,r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.68))};img.onerror=rej;img.src=u})}async function addFiles(fs){const left=MAX-photos.length;if(left<=0)return alert('사진은 최대 8장까지 등록할 수 있습니다.');for(const f of [...fs].slice(0,left)){try{photos.push(await compress(f))}catch(e){console.log(e)}}renderPhotos()}cameraInput.onchange=async e=>{await addFiles(e.target.files||[]);e.target.value=''};albumInput.onchange=async e=>{await addFiles(e.target.files||[]);e.target.value=''};function render(){renderSites();const today=new Date().toDateString();todayCount.textContent=data.incidents.filter(i=>new Date(i.createdAt).toDateString()===today).length;waitCount.textContent=data.incidents.filter(i=>i.status==='reported').length;approvedCount.textContent=data.incidents.filter(i=>i.status==='approved').length;allCount.textContent=data.incidents.length;rCount.textContent=data.incidents.filter(i=>i.status==='reported').length;aCount.textContent=data.incidents.filter(i=>i.status==='approved').length;cCount.textContent=data.incidents.filter(i=>i.status==='closed').length;recent.innerHTML=data.incidents.slice(0,4).map(i=>`<div class="item"><div class="itemTop"><b>${esc(i.site)}</b><span>${fmt(i.occurredAt)}</span></div><p>${esc(i.summary)}</p>${sevP(i.severity)}${statusP(i.status)}</div>`).join('')||'<div class="empty">등록된 사고가 없습니다.</div>';renderTable();renderManager();renderPhotos()}function renderTable(){const sf=siteFilter.value||'전체',st=statusFilter.value||'전체';const arr=data.incidents.filter(i=>(sf==='전체'||i.site===sf)&&(st==='전체'||i.status===st));rows.innerHTML=arr.map(i=>`<tr onclick="openSafety('${i.id}')"><td>${fmt(i.occurredAt)}</td><td><b>${esc(i.site)}</b></td><td>${esc(i.type)}</td><td>${esc(i.summary)}</td><td>${sevP(i.severity)}</td><td>${statusP(i.status)}</td><td>${i.photos.length||'-'}</td></tr>`).join('');tableEmpty.classList.toggle('hide',arr.length>0)}function renderManager(){const arr=data.incidents.filter(i=>i.status==='approved'||i.status==='closed');mgrGrid.innerHTML=arr.map(i=>`<div class="mgr" onclick="openManager('${i.id}')"><span style="font-size:9px;color:#8995a4">${fmt(i.occurredAt)}</span><h3>${esc(i.site)}</h3>${sevP(i.severity)}${statusP(i.status)}<p>${esc(i.summary)}</p></div>`).join('')||'<div class="panel empty">안전관리자가 승인한 사고가 아직 없습니다.</div>'}reportForm.onsubmit=e=>{e.preventDefault();const now=new Date().toISOString();data.incidents.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),site:site.value,occurredAt:new Date(occurredAt.value).toISOString(),type:type.value,severity:severity.value,injuredName:injured.value.trim()||'미입력',job:job.value.trim()||'미입력',summary:summary.value.trim(),immediateAction:action.value.trim()||'미입력',photos:[...photos],reporter:reporter.value.trim(),status:'reported',safetyNote:'',createdAt:now});photos=[];summary.value='';action.value='';injured.value='';job.value='';occurredAt.value=localDT();save();alert('사고보고가 등록되었습니다.')}function openSafety(id){const i=data.incidents.find(x=>x.id===id);if(!i)return;modalRoot.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="drawer"><div class="drawerTop"><div><h2 style="margin:0">사고 검토·승인</h2><p class="sub">${fmt(i.occurredAt)} · ${esc(i.site)}</p></div><button class="x" onclick="closeModal()">×</button></div>${i.photos.length?`<div class="drawerPhotos">${i.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}<div class="formgrid"><label class="lbl"><span>현장</span><input id="eSite" value="${esc(i.site)}"></label><label class="lbl"><span>사고유형</span><input id="eType" value="${esc(i.type)}"></label><label class="lbl"><span>사고자</span><input id="eInj" value="${esc(i.injuredName)}"></label><label class="lbl"><span>업무</span><input id="eJob" value="${esc(i.job)}"></label></div><label class="lbl"><span>사고내용</span><textarea id="eSum" rows="4">${esc(i.summary)}</textarea></label><label class="lbl"><span>현장 즉시조치</span><textarea id="eAct" rows="3">${esc(i.immediateAction)}</textarea></label><label class="lbl"><span>안전관리자 검토·조치사항</span><textarea id="eNote" rows="4">${esc(i.safetyNote||'')}</textarea></label><div class="actions"><button class="save" onclick="saveEdit('${id}')">수정 저장</button>${i.status==='reported'?`<button class="approve" onclick="approveInc('${id}')">검토 승인</button>`:''}${i.status==='approved'?`<button class="closeBtn" onclick="closeInc('${id}')">조치 종결</button>`:''}<button class="delete" onclick="deleteInc('${id}')">삭제</button></div></div></div>`}function patch(i){i.site=eSite.value;i.type=eType.value;i.injuredName=eInj.value;i.job=eJob.value;i.summary=eSum.value;i.immediateAction=eAct.value;i.safetyNote=eNote.value}function saveEdit(id){const i=data.incidents.find(x=>x.id===id);patch(i);save();alert('수정되었습니다.');openSafety(id)}function approveInc(id){const i=data.incidents.find(x=>x.id===id);patch(i);i.status='approved';i.approvedAt=new Date().toISOString();save();closeModal()}function closeInc(id){const i=data.incidents.find(x=>x.id===id);patch(i);i.status='closed';save();closeModal()}function deleteInc(id){if(!confirm('이 사고 기록을 삭제할까요?'))return;data.incidents=data.incidents.filter(x=>x.id!==id);save();closeModal()}function openManager(id){const i=data.incidents.find(x=>x.id===id);modalRoot.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="drawer"><div class="drawerTop"><div><h2 style="margin:0">${esc(i.site)} 사고보고</h2><p class="sub">${fmt(i.occurredAt)}</p></div><button class="x" onclick="closeModal()">×</button></div>${i.photos.length?`<div class="drawerPhotos">${i.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}<p><b>사고자</b><br>${esc(i.injuredName)} · ${esc(i.job)}</p><p><b>사고내용</b><br>${esc(i.summary)}</p><p><b>현장 즉시조치</b><br>${esc(i.immediateAction)}</p><p><b>안전관리자 검토</b><br>${esc(i.safetyNote||'추가 의견 없음')}</p></div></div>`}function closeModal(){modalRoot.innerHTML=''}siteFilter.onchange=renderTable;statusFilter.onchange=renderTable;document.querySelectorAll('.roles button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.roles button').forEach(x=>x.classList.toggle('on',x===b));const r=b.dataset.role;fieldView.classList.toggle('hide',r!=='field');safetyView.classList.toggle('hide',r!=='safety');managerView.classList.toggle('hide',r!=='manager');roleNote.textContent=r==='field'?'● 현장소장 화면 · 사고 발생 직후 간단히 등록합니다.':r==='safety'?'● 안전관리자 화면 · 전체 사고를 검토하고 승인·편집·종결합니다.':'● 관리자 화면 · 안전관리자가 승인한 사고만 열람합니다.';render()});occurredAt.value=localDT();render();</script></body></html>
