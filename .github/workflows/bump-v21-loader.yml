name: Bump v21 loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader query to v21
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="/drag-compose-v18.js?v=19"></script>'
          new='<script src="/drag-compose-v18.js?v=21"></script>'
          if old in s:
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          if git diff --quiet -- index.html; then
            echo "already v21"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load v21 app bundle"
          git push
