name: Validate v47
on:
  push:
    branches: [main]
    paths:
      - 'app-v47.js'
      - 'app-v47.css'
      - 'index.html'
      - 'launch/v47.html'
      - 'sw.js'
      - '.github/workflows/validate-v47.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app-v47.js
          node --check sw.js
      - name: Version wiring
        run: |
          grep -q 'data-kokmatch-version="47"' index.html
          grep -q '/app-v47.js?v=47' index.html
          grep -q '/app-v47.css?v=47' index.html
          grep -q 'data-kokmatch-version="47"' launch/v47.html
          grep -q "kokmatch-v47" sw.js
      - name: PC compatibility guards
        run: |
          grep -q "kokmatch-groups-v47" app-v47.js
          grep -q "t.id==='modal'&&startedInside" app-v47.js
          grep -q "window.PointerEvent" app-v47.js
          grep -q "queue render v47" app-v47.js
      - name: Waiting-screen order
        run: |
          python - <<'PY'
          s=open('app-v47.js',encoding='utf-8').read()
          r=s[s.index('renderQueue=function(){'):]
          assert r.index('const personal=') < r.index('const pending=')
          assert '${composer}${personal}${pending}' in r
          print('v47 queue order and PC guards validated')
          PY
