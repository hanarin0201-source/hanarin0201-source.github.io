name: Validate Kokmatch v46
on:
  push:
    branches: [main]
    paths:
      - 'app-v46.js'
      - 'app-v46.css'
      - 'index.html'
      - 'launch/v46.html'
      - 'sw.js'
      - 'latest-version.json'
      - '.github/workflows/validate-v46.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app-v46.js
      - name: Verify v46 wiring
        run: |
          grep -q 'data-kokmatch-version="46"' index.html
          grep -q 'app-v46.js?v=46' index.html
          grep -q 'app-v46.css?v=46' index.html
          grep -q 'data-kokmatch-version="46"' launch/v46.html
          grep -q "kokmatch-v46" sw.js
          grep -q '"version":46' latest-version.json
          grep -q 'MEMBER_PAGE_SIZE46=80' app-v46.js
          grep -q 'return 4000' app-v46.js
          grep -q 'STATE_V46' app-v46.js
      - name: Mark success
        run: |
          printf 'v46 syntax and scale optimization validation passed\n' > v46-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v46-validation-ok.txt
          git commit -m "Validate v46 deployment" || exit 0
          git push
