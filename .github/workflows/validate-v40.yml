name: Validate Kokmatch v40
on:
  push:
    branches: [main]
    paths:
      - 'app-v38.js'
      - 'app-v40.js'
      - 'index.html'
      - 'launch/v40.html'
      - 'sw.js'
      - 'latest-version.json'
      - '.github/workflows/validate-v40.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-v38.js
          node --check app-v40.js
      - name: Verify v40 update and reset shell
        run: |
          grep -q 'app-v40.js?v=40' index.html
          grep -q 'data-kokmatch-version="40"' index.html
          grep -q 'data-kokmatch-version="40"' launch/v40.html
          grep -q 'kokmatch-updater' app-v38.js
          grep -q 'kokmatch-updater' app-v40.js
          grep -q 'kokmatch-reset-v40' app-v40.js
          grep -q "kokmatch-v40" sw.js
          grep -q '"version":40' latest-version.json
          grep -q 'reset_daily' app-v40.js
          grep -q 'reset_cumulative' app-v40.js
          grep -q 'reset_roster' app-v40.js
      - name: Mark validation success
        run: |
          printf 'v40 syntax, updater, launcher and reset validation passed\n' > v40-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v40-validation-ok.txt
          git commit -m "Validate v40 deployment" || exit 0
          git push
