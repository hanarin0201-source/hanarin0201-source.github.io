name: Validate Kokmatch v43
on:
  push:
    branches: [main]
    paths:
      - 'app-v42-fix.js'
      - 'app-v43.js'
      - 'index.html'
      - 'launch/v43.html'
      - 'sw.js'
      - 'latest-version.json'
      - '.github/workflows/validate-v43.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-v42-fix.js
          node --check app-v43.js
      - name: Verify v43 shell and same-origin update flow
        run: |
          grep -q 'data-kokmatch-version="43"' index.html
          grep -q 'app-v43.js?v=43' index.html
          grep -q 'data-kokmatch-version="43"' launch/v43.html
          grep -q 'app-v43.js?v=43' launch/v43.html
          grep -q "kokmatch-v43" sw.js
          grep -q 'app-v43.js?v=43' sw.js
          grep -q '"version":43' latest-version.json
          grep -q "target.origin!==location.origin" app-v42-fix.js
          grep -q "target.pathname" app-v42-fix.js
          grep -q "target.origin!==location.origin" app-v43.js
          grep -q 'set_admin_badge_visibility' app-v43.js
          grep -q '운영진만' app-v43.js
      - name: Mark validation success
        run: |
          printf 'v43 syntax, same-origin updater and admin badge visibility validation passed\n' > v43-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v43-validation-ok.txt
          git commit -m "Validate v43 deployment" || exit 0
          git push
