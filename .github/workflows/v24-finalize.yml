name: Finalize Kokmatch v24
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v24 loader and retry handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/drag-compose-v18.js?v=23','/drag-compose-v18.js?v=24')
          p.write_text(s,encoding='utf-8')
          q=Path('mobile-compose-v24.js')
          t=q.read_text(encoding='utf-8')
          t=t.replace("else if(c.sourceId&&c.memberId)openPendingMember24(c.sourceId,c.memberId)","else if(c.sourceId&&(c.fromId||c.memberId))openPendingMember24(c.sourceId,c.fromId||c.memberId)")
          q.write_text(t,encoding='utf-8')
          PY
      - name: Commit if needed
        run: |
          if git diff --quiet -- index.html mobile-compose-v24.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile-compose-v24.js
          git commit -m "Finalize v24 loader and retry flow"
          git push
