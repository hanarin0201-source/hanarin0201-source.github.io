name: Validate Kokmatch v36
on:
  push:
    branches: [main]
    paths:
      - 'app-v36.js'
      - 'app-v36.css'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/validate-v36.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app-v36.js
      - name: Verify v36 shell
        run: |
          grep -q 'app-v36.js?v=36' index.html
          grep -q 'app-v36.css?v=36' index.html
          grep -q "kokmatch-v36" sw.js
          grep -q '선택 비우기' app-v35.js
          if grep -q '선택 비우기' app-v36.js; then exit 1; fi
      - name: Mark validation success
        run: |
          printf 'v36 syntax and shell validation passed\n' > v36-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v36-validation-ok.txt
          git commit -m "Validate v36 deployment" || exit 0
          git push
