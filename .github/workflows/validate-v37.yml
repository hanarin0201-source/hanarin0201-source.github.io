name: Validate Kokmatch v37
on:
  push:
    branches: [main]
    paths:
      - 'app-v37.js'
      - 'app-v37.css'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/validate-v37.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app-v37.js
      - name: Verify v37 shell
        run: |
          grep -q 'app-v37.js?v=37' index.html
          grep -q 'app-v37.css?v=37' index.html
          grep -q "kokmatch-v37" sw.js
      - name: Mark validation success
        run: |
          printf 'v37 syntax and shell validation passed\n' > v37-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v37-validation-ok.txt
          git commit -m "Validate v37 deployment" || exit 0
          git push