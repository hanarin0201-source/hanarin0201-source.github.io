name: Validate Kokmatch v35
on:
  push:
    branches: [main]
    paths:
      - 'app-v35.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/validate-v35.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app-v35.js
      - name: Verify v35 shell references
        run: |
          grep -q 'app-v35.js?v=35' index.html
          grep -q "kokmatch-v35" sw.js
      - name: Mark validation success
        run: |
          printf 'v35 syntax and shell validation passed\n' > v35-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v35-validation-ok.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Mark v35 validation passed"
          git push
