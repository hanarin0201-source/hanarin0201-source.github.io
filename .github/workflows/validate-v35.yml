name: Validate Kokmatch v35
on:
  push:
    branches: [main]
    paths:
      - 'app-v35.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/validate-v35.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app-v35.js
      - name: Verify v35 shell references
        run: |
          grep -q 'app-v35.js?v=35' index.html
          grep -q "kokmatch-v35" sw.js
