name: Validate Kokmatch v44
on:
  push:
    branches: [main]
    paths:
      - 'app-v44.js'
      - 'app-v44.css'
      - 'index.html'
      - 'launch/v44.html'
      - 'sw.js'
      - 'latest-version.json'
      - '.github/workflows/validate-v44.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check v44 JavaScript syntax
        run: node --check app-v44.js
      - name: Verify v44 behavior wiring
        run: |
          grep -q 'data-kokmatch-version="44"' index.html
          grep -q 'app-v44.js?v=44' index.html
          grep -q 'app-v44.css?v=44' index.html
          grep -q 'data-kokmatch-version="44"' launch/v44.html
          grep -q "kokmatch-v44" sw.js
          grep -q '"version":44' latest-version.json
          grep -q 'currentYearKst44()-Number(year)+1' app-v44.js
          grep -q 'personalNodes.forEach' app-v44.js
          grep -q 'role-member44' app-v44.js
          grep -q 'role-organizer' app-v44.css
          grep -q 'actionBusy44' app-v44.js
          grep -q 'renderCurrent44' app-v44.js
      - name: Mark validation success
        run: |
          printf 'v44 syntax, age formula, queue order, badges and render optimization validation passed\n' > v44-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v44-validation-ok.txt
          git commit -m "Validate v44 deployment" || exit 0
          git push
