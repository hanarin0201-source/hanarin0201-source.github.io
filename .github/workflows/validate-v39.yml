name: Validate Kokmatch v39
on:
  push:
    branches: [main]
    paths:
      - 'app-v39.js'
      - 'app-v39.css'
      - 'index.html'
      - 'sw.js'
      - 'latest-version.json'
      - '.github/workflows/validate-v39.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app-v39.js
      - name: Verify v39 shell
        run: |
          grep -q 'app-v39.js?v=39' index.html
          grep -q 'app-v39.css?v=39' index.html
          grep -q "kokmatch-v39" sw.js
          grep -q '"version":39' latest-version.json
      - name: Mark validation success
        run: |
          printf 'v39 syntax and shell validation passed\n' > v39-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v39-validation-ok.txt
          git commit -m "Validate v39 deployment" || exit 0
          git push
