name: Validate Kokmatch v42
on:
  push:
    branches: [main]
    paths:
      - 'app-v41.js'
      - 'app-v42.js'
      - 'index.html'
      - 'launch/v42.html'
      - 'sw.js'
      - 'latest-version.json'
      - '.github/workflows/validate-v42.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-v41.js
          node --check app-v42.js
      - name: Verify v42 shell and permissions layer
        run: |
          grep -q 'data-kokmatch-version="42"' index.html
          grep -q 'app-v42.js?v=42' index.html
          grep -q 'data-kokmatch-version="42"' launch/v42.html
          grep -q "kokmatch-v42" sw.js
          grep -q '"version":42' latest-version.json
          grep -q 'kokmatch-manage-v42' app-v42.js
          grep -q 'purge_group' app-v42.js
          grep -q '게임편성자는 일반회원·게스트 신규등록' app-v42.js
      - name: Mark validation success
        run: |
          printf 'v42 syntax, launcher, update shell and permission layer validation passed\n' > v42-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v42-validation-ok.txt
          git commit -m "Validate v42 deployment" || exit 0
          git push
