name: Bump Kokmatch loader to v32
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump v32 cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('/drag-compose-v18.js?v=31','/drag-compose-v18.js?v=32')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const CACHE='kokmatch-v31'","const CACHE='kokmatch-v32'")
          s=s.replace("'/drag-compose-v18.js?v=31'","'/drag-compose-v18.js?v=32'")
          if "'/mobile-compose-v32.js?v=32'" not in s:
              s=s.replace("'/mobile-compose-v31.js?v=31'","'/mobile-compose-v31.js?v=31','/mobile-compose-v32.js?v=32'")
          if "'/versions/v31/index.html'" not in s:
              s=s.replace("'/versions/v30/index.html'","'/versions/v30/index.html','/versions/v31/index.html'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if needed
        run: |
          if git diff --quiet -- index.html sw.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Bump app loader and cache to v32"
          git push
