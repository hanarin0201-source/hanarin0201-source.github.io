name: Validate Kokmatch v41
on:
  push:
    branches: [main]
    paths:
      - 'app-v38.js'
      - 'app-v41.js'
      - 'index.html'
      - 'launch/v41.html'
      - 'sw.js'
      - 'latest-version.json'
      - '.github/workflows/validate-v41.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-v38.js
          node --check app-v41.js
      - name: Verify v41 update shell
        run: |
          grep -q 'data-kokmatch-version="41"' index.html
          grep -q 'app-v41.js?v=41' index.html
          grep -q 'data-kokmatch-version="41"' launch/v41.html
          grep -q 'kokmatch-updater' app-v38.js
          grep -q 'logout_all' app-v38.js
          grep -q 'logout_all' app-v41.js
          grep -q "kokmatch-v41" sw.js
          grep -q '"version":41' latest-version.json
      - name: Mark validation success
        run: |
          printf 'v41 syntax, legacy rescue, updater and clean-login validation passed\n' > v41-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v41-validation-ok.txt
          git commit -m "Validate v41 deployment" || exit 0
          git push
