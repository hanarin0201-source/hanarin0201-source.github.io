<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콕매치 v1.1</title></head><body><script>(async()=>{try{localStorage.removeItem('kokmatch_token');localStorage.removeItem('kokmatch_refresh_state');sessionStorage.clear();if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}location.replace('/?loaded=1.1&fresh='+Date.now())})();</script></body></html>
