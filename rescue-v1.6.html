<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>콕매치 v1.6 복구</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f7fb;color:#182033;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:28px;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}b{font-size:20px}.meta{margin-top:10px;color:#667085;line-height:1.55}</style></head><body><div class="box"><b>콕매치 v1.6 복구 중</b><div class="meta">이전 자동업데이트와 브라우저 캐시를 정리한 뒤 로그인 화면으로 연결합니다.</div></div><script>(async()=>{try{localStorage.clear();sessionStorage.clear();if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}setTimeout(()=>location.replace('/?boot=v1.6&rescue='+Date.now()),150)})();</script></body></html>
