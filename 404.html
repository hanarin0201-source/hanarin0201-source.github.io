<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>콕매치 복구</title></head><body><div style="font-family:system-ui;padding:24px;text-align:center">콕매치로 다시 연결 중입니다...</div><script>(async()=>{try{localStorage.removeItem('kokmatch_token');localStorage.removeItem('kokmatch_refresh_state');sessionStorage.clear();if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}location.replace('/?recovery=1.4&from404=1&fresh='+Date.now())})();</script></body></html>
