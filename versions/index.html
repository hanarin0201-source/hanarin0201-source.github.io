<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2453d4"><title>콕매치 버전 보관함</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f5f7fb;color:#172033;padding:20px}.wrap{max-width:560px;margin:auto}.card{background:#fff;border:1px solid #dbe3f8;border-radius:18px;padding:16px;margin-bottom:10px}.top{background:linear-gradient(135deg,#2453d4,#5138c5);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}.top h1{font-size:20px;margin:0 0 6px}.meta{font-size:12px;color:#6f7e9b;line-height:1.6}.top .meta{color:#ffffffd9}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{display:inline-block;border:0;border-radius:12px;padding:10px 12px;font-weight:850;text-decoration:none;background:#2453d4;color:#fff}.ghost{background:#fff;color:#2453d4;border:1px solid #dbe3f8}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#edf2ff;color:#2453d4;font-size:11px;font-weight:900}.denied{background:#fff4f4;color:#a43f3f;border-radius:14px;padding:14px;line-height:1.6}</style></head><body><div class="wrap" id="app"><div class="card">총관리자 권한을 확인하고 있습니다...</div></div><script>
const API='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/kokmatch-api';
const versions=[
 {v:23,d:'개인 대기시간 연속 누적 · 1~3명 미완성 편성대기 지원'},
 {v:22,d:'출생연도 연령대 자동설정 · 개인 게임대기와 대기조 교체'},
 {v:21,d:'4칸 편성 미리보기 복원 · 점수입력 제거 · 버전 백업 체계 적용'},
 {v:20,d:'드래그 제거 · 대기순 정렬 · 대기조 인원교체 · 코트 배정 확인'}
];
(async()=>{const box=document.getElementById('app');try{const t=localStorage.getItem('kokmatch_token')||'';if(!t)throw new Error('no token');const r=await fetch(API+'?api=state',{headers:{authorization:'Bearer '+t},cache:'no-store'});const x=await r.json();if(!r.ok||x?.user?.role!=='admin')throw new Error('not admin');box.innerHTML='<div class="top"><h1>🏸 콕매치 버전 보관함</h1><div class="meta">총관리자 전용입니다. 기능 변경 전 운영본을 확인·비교·복구할 수 있습니다. 회원·경기 데이터는 현재 서버와 연결됩니다.</div></div><div class="card"><div class="row"><div><b>현재 운영본</b><div class="meta">콕매치 v24 · 당일 임시편성자 · 대기조 빈자리 이동 확장</div></div><span class="badge">CURRENT</span></div><a class="btn" style="margin-top:12px" href="/">v24 열기</a></div>'+versions.map(z=>'<div class="card"><div class="row"><div><b>콕매치 v'+z.v+'</b><div class="meta">'+z.d+'</div></div><span class="badge">BACKUP</span></div><a class="btn ghost" style="margin-top:12px" href="/versions/v'+z.v+'/index.html">v'+z.v+' 백업 열기</a></div>').join('')}catch(e){box.innerHTML='<div class="card"><h3 style="margin-top:0">총관리자 전용</h3><div class="denied">구버전 열람은 총관리자 계정에서만 사용할 수 있습니다.</div><a class="btn" style="margin-top:12px" href="/">콕매치로 돌아가기</a></div>'}})();
</script></body></html>
